name: CI Pipeline - App Zapatillas

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen de Docker
        run: |
          echo "Construyendo imagen Docker..."
          # Usamos tu usuario de Docker Hub en el nombre de la imagen
          docker build -t ${{ secrets.DOCKER_USERNAME }}/app-zapatillas:latest .
          
          echo "Subiendo imagen a Docker Hub..."
          docker push ${{ secrets.DOCKER_USERNAME }}/app-zapatillas:latest
          
          echo "¡Subida completada con éxito!"
